[package]
name = "sahne"
version = "0.1.0"
description = "Animated synced lyrics and ambient colors for Spotify on Linux"
authors = ["Sahne contributors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets.
name = "sahne_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MPRIS over the session bus; tokio integration so it shares Tauri's runtime.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
# Merging D-Bus signal streams in the player loop.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# OpenRGB ambient lighting. The OpenRGB client crate is GPL-2.0, so builds
# with this feature are distributed under the GPL; default builds stay MIT.
openrgb2 = { version = "0.4", optional = true }

[features]
default = []
lighting = ["dep:openrgb2"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

