# cargo-deny: `cargo deny check` (run in CI): security advisories, banned
# or duplicated crates, licences and sources. The licence allow-list must
# match dev-tools/licenses/about.toml, which builds the in-app licence list.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[advisories]
ignore = [
  # proc-macro-error is unmaintained. It reaches us only as a build-time
  # proc-macro of glib-macros 0.18 (gtk3-rs, used by Tauri's Linux backend),
  # so it never runs in the shipped app and processes no untrusted input.
  # It goes away when Tauri moves to gtk4-rs. Review by 2027-04-01.
  { id = "RUSTSEC-2024-0370", reason = "build-time only, via Tauri's gtk3 stack; review by 2027-04-01" },
]

[bans]
# Tauri's dependency tree has several unavoidable duplicates; report them
# without failing.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
