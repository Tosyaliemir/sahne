# cargo-deny: `cargo deny check` (run in CI). The licence allow-list must
# match dev-tools/licenses/about.toml, which builds the in-app licence list.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9
