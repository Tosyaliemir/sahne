version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/src-tauri", "/dev-tools/mock-player"]
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet
      # (typescript-eslint/typescript-eslint#10940). Drop this once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
