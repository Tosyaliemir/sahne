name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            dev-tools/mock-player

      - run: pnpm install --frozen-lockfile
      - name: Frontend checks
        run: |
          pnpm check
          pnpm test
          pnpm build

      - name: Backend checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Mock player builds
        working-directory: dev-tools/mock-player
        run: cargo clippy -- -D warnings

  # The Windows backend (media sessions, idle time, power requests) only
  # compiles there; make sure it keeps building and passing its tests.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds the built frontend.
      - run: pnpm build
      - name: Backend checks
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
