# Machine-readable licensing (https://reuse.software). Checked in CI with
# `reuse lint`. Human-readable summary: THIRD_PARTY_NOTICES.md.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sahne contributors"
SPDX-License-Identifier = "MIT"

# Derived from React Bits; keep the upstream licence.
[[annotations]]
path = ["src/lib/fx/electricBorder.ts", "src/lib/fx/reflectivePlate.ts"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 David Haz", "2026 Sahne contributors"]
SPDX-License-Identifier = "LicenseRef-MIT-Commons-Clause"

[[annotations]]
path = ["src/assets/fonts/*.woff2", "src/assets/fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2018 The Manrope Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Licence texts and generated licence lists quote other projects' notices;
# don't parse them for tags.
[[annotations]]
path = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/assets/licenses/*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Sahne contributors"
SPDX-License-Identifier = "MIT"

# Screenshots show third-party artwork and lyrics for illustration only.
[[annotations]]
path = "docs/screenshots/**"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Sahne contributors", "Album artwork and lyrics: their respective owners"]
SPDX-License-Identifier = "LicenseRef-Screenshots"
